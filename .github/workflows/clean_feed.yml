name: Scheduled Product Feed Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Grant the cloud runner permission to save the CSV files back into your repository
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download XMLs and Generate Clean CSVs
      shell: powershell
      env:
        USER: ${{ secrets.FEED_USER }}
        PASS: ${{ secrets.FEED_PASS }}
      run: |
        # Build network credentials securely using your secrets
        $secPassword = ConvertTo-SecureString $env:PASS -AsPlainText -Force
        $credentials = New-Object System.Management.Automation.PSCredential($env:USER, $secPassword)

        # --- FEED 1: bc-bikes-feed.csv ---
        $xmlUrl1 = "https://www.bicyclechain.co.uk/xml/11/products-advanced.xml"
        $xmlPath1 = "${{ github.workspace }}\largefile1.xml"
        $csvPath1 = "${{ github.workspace }}\bc-bikes-feed.csv"
        
        Write-Host "Downloading first authenticated XML file..."
        Invoke-WebRequest -Uri $xmlUrl1 -OutFile $xmlPath1 -Credential $credentials
        
        Write-Host "Processing first feed and stripping descriptions..."
        [xml]$xml1 = Get-Content -Path $xmlPath1
        $items1 = $xml1.SelectNodes("//item")
        if ($items1.Count -eq 0) { $items1 = $xml1.SelectNodes("//entry") }
        
        $csvData1 = foreach ($item in $items1) {
            $productObj = [ordered]@{}
            foreach ($prop in $item.ChildNodes) {
                if ($prop.LocalName -eq "description") {
                    $productObj["description"] = ""
                } else {
                    $productObj[$prop.LocalName] = $prop.InnerText.Trim()
                }
            }
            [PSCustomObject]$productObj
        }
        $csvData1 | Export-Csv -Path $csvPath1 -NoTypeInformation -Encoding UTF8

        # --- FEED 2: bc-product-feed.csv ---
        # Replace the URL below with your second XML file's link
        $xmlUrl2 = "https://www.bicyclechain.co.uk/xml/202/products-advanced.xml"
        $xmlPath2 = "${{ github.workspace }}\largefile2.xml"
        $csvPath2 = "${{ github.workspace }}\bc-product-feed.csv"
        
        Write-Host "Downloading second authenticated XML file..."
        Invoke-WebRequest -Uri $xmlUrl2 -OutFile $xmlPath2 -Credential $credentials
        
        Write-Host "Processing second feed and stripping descriptions..."
        [xml]$xml2 = Get-Content -Path $xmlPath2
        $items2 = $xml2.SelectNodes("//item")
        if ($items2.Count -eq 0) { $items2 = $xml2.SelectNodes("//entry") }
        
        $csvData2 = foreach ($item in $items2) {
            $productObj = [ordered]@{}
            foreach ($prop in $item.ChildNodes) {
                if ($prop.LocalName -eq "description") {
                    $productObj["description"] = ""
                } else {
                    $productObj[$prop.LocalName] = $prop.InnerText.Trim()
                }
            }
            [PSCustomObject]$productObj
        }
        $csvData2 | Export-Csv -Path $csvPath2 -NoTypeInformation -Encoding UTF8
        
        Write-Host "Both CSVs generated successfully!"

    - name: Commit and Push clean CSVs back to GitHub
      run: |
        git config --global user.name 'Feed Bot'
        git config --global user.email 'bot@github.com'
        git add bc-bikes-feed.csv bc-product-feed.csv
        git commit -m "Automated update of product feed CSVs" || exit 0
        git push
