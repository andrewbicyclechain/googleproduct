name: Scheduled Product Feed Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

# Grant the cloud runner permission to save the CSV file back into your repository
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download XML and Generate Clean CSV
      shell: powershell
      env:
        USER: ${{ secrets.FEED_USER }}
        PASS: ${{ secrets.FEED_PASS }}
      run: |
        # 1. Prepare protected download file paths
        $xmlUrl = "https://www.bicyclechain.co.uk/xml/1/products-advanced.xml"
        $xmlPath = "${{ github.workspace }}\largefile.xml"
        $csvPath = "${{ github.workspace }}\prodsnodesc.csv"
        
        # 2. Build the network credentials securely using your secrets
        $secPassword = ConvertTo-SecureString $env:PASS -AsPlainText -Force
        $credentials = New-Object System.Management.Automation.PSCredential($env:USER, $secPassword)
        
        Write-Host "Downloading authenticated 200MB XML file..."
        Invoke-WebRequest -Uri $xmlUrl -OutFile $xmlPath -Credential $credentials
        
        # 3. Process data and completely clear descriptions
        Write-Host "Processing data and stripping descriptions..."
        [xml]$xml = Get-Content -Path $xmlPath
        $items = $xml.SelectNodes("//item")
        if ($items.Count -eq 0) { $items = $xml.SelectNodes("//entry") }
        
        $csvData = foreach ($item in $items) {
            $productObj = [ordered]@{}
            foreach ($prop in $item.ChildNodes) {
                if ($prop.LocalName -eq "description") {
                    $productObj["description"] = ""
                } else {
                    $productObj[$prop.LocalName] = $prop.InnerText.Trim()
                }
            }
            [PSCustomObject]$productObj
        }
        
        $csvData | Export-Csv -Path $csvPath -NoTypeInformation -Encoding UTF8
        Write-Host "CSV generated successfully!"

    - name: Commit and Push clean CSV back to GitHub
      run: |
        git config --global user.name 'Feed Bot'
        git config --global user.email 'bot@github.com'
        git add prodsnodesc.csv
        git commit -m "Automated update of product feed CSV" || exit 0
        git push
