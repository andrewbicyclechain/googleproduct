name: Scheduled Product Feed Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Download XML and Generate Dual CSVs
      shell: powershell
      env:
        USER: ${{ secrets.FEED_USER }}
        PASS: ${{ secrets.FEED_PASS }}
      run: |
        # 1. Setup paths
        $xmlUrl = "https://www.bicyclechain.co.uk/xml/199/products-advanced.xml"
        $xmlPath = "${{ github.workspace }}\largefile.xml"
        $csvFull = "${{ github.workspace }}\prodsnodesc.csv"
        $csvSimple = "${{ github.workspace }}\prods_simple.csv"
        
        # 2. Force modern TLS protocols and masquerade as a normal browser
        [ServicePointManager]::SecurityProtocol = [SecurityProtocolType]::Tls12 -bor [SecurityProtocolType]::Tls13
        $userAgent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        
        # 3. Handle download with human browser bypass headers
        try {
            $secPassword = ConvertTo-SecureString $env:PASS -AsPlainText -Force
            $credentials = New-Object System.Management.Automation.PSCredential($env:USER, $secPassword)
            
            Write-Host "Downloading 200MB XML file using browser simulation..."
            # Passing User-Agent tells the Apache server this is Chrome on Windows, avoiding firewall blocks
            Invoke-WebRequest -Uri $xmlUrl -OutFile $xmlPath -Credential $credentials -UserAgent $userAgent -ErrorAction Stop
        } catch {
            Write-Error "Download failed! Firewall block or credentials wrong. Error Details: $_"
            exit 1
        }
        
        # Verify file exists and is not empty
        if (!(Test-Path $xmlPath) -or (Get-Item $xmlPath).Length -eq 0) {
            Write-Error "Downloaded XML file is missing or completely empty."
            exit 1
        }

        # 4. Stream-load the large XML file safely
        Write-Host "Streaming XML file to process data safely..."
        try {
            [xml]$xml = New-Object System.Xml.XmlDocument
            $reader = [System.IO.StreamReader]::new($xmlPath)
            $xml.Load($reader)
            $reader.Close()
        } catch {
            Write-Error "Failed to parse XML layout. Error: $_"
            exit 1
        }

        $items = $xml.SelectNodes("//item")
        if ($items.Count -eq 0) { $items = $xml.SelectNodes("//entry") }
        Write-Host "Found $($items.Count) products to process."

        # The exact columns for Google Sheets
        $simpleColumns = @("id","title","link","mpn","gtin","availability","stock_level","product_type","current_price","regular_price","brand","size","color")
        
        # 5. Generate arrays in a single pass
        $fullData = [System.Collections.Generic.List[PSCustomObject]]::new()
        $simpleData = [System.Collections.Generic.List[PSCustomObject]]::new()
        
        foreach ($item in $items) {
            # --- FILE 1: Full Version ---
            $fullObj = [ordered]@{}
            foreach ($prop in $item.ChildNodes) {
                if ($prop.LocalName -eq "description") {
                    $fullObj["description"] = ""
                } elseif ($prop.LocalName) {
                    $fullObj[$prop.LocalName] = $prop.InnerText.Trim()
                }
            }
            $fullData.Add([PSCustomObject]$fullObj)
            
            # --- FILE 2: Simple Version ---
            $simpleObj = [ordered]@{}
            foreach ($col in $simpleColumns) { $simpleObj[$col] = "" }
            foreach ($prop in $item.ChildNodes) {
                if ($simpleColumns -contains $prop.LocalName) {
                    $simpleObj[$prop.LocalName] = $prop.InnerText.Trim()
                }
            }
            $simpleData.Add([PSCustomObject]$simpleObj)
        }
        
        # 6. Export both CSV files
        Write-Host "Saving CSV files to disk..."
        $fullData | Export-Csv -Path $csvFull -NoTypeInformation -Encoding UTF8
        $simpleData | Export-Csv -Path $csvSimple -NoTypeInformation -Encoding UTF8
        Write-Host "Successfully generated both data files!"

    - name: Commit and Push clean CSVs back to GitHub
      run: |
        git config --global user.name 'Feed Bot'
        git config --global user.email 'bot@github.com'
        git add prodsnodesc.csv prods_simple.csv
        git commit -m "Automated update of product feed CSVs" || exit 0
        git push
