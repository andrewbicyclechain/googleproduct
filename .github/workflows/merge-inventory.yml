name: Merge Local Inventory CSVs

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download, format, and merge CSV files
        env:
          FEED_USER: ${{ secrets.FEED_USER }}
          FEED_PASS: ${{ secrets.FEED_PASS }}
        run: |
          mkdir -p output
          
          # Download using HTTP Basic Authentication
          curl -f -sS -u "$FEED_USER:$FEED_PASS" "https://www.bicyclechain.co.uk/csv/202/local-inventory.csv" -o file1.csv
          curl -f -sS -u "$FEED_USER:$FEED_PASS" "https://www.bicyclechain.co.uk/csv/11/local-inventory.csv" -o file2.csv
          
          # Merge CSVs and output both unmapped and mapped versions
          python3 - << 'EOF'
          import csv

          files = ['file1.csv', 'file2.csv']
          price_cols = ['price', 'sale_price']
          unmapped_path = 'output/combined-inventory.csv'
          mapped_path = 'output/combined-inventory-mapped.csv'

          store_map = {
              'taunton bicycle chain': 'TAUN1',
              'bridgwater bicycle chain': 'BRID1',
              'weston-super-mare bicycle chain': 'WEST1',
              'hereford bicycle chain': 'HERE1',
              'yeovil bicycle chain': 'YEO1',
              'bristol giant brand store': 'BRIS1',
              'southampton giant brand store': 'SOT2',
              'southampton bicycle chain': 'SOT1',
              'chichester bicycle chain': 'CHI1',
          }

          with open(unmapped_path, 'w', newline='', encoding='utf-8') as unmapped_f, \
               open(mapped_path, 'w', newline='', encoding='utf-8') as mapped_f:
              
              unmapped_writer = None
              mapped_writer = None

              for filename in files:
                  with open(filename, 'r', newline='', encoding='utf-8-sig') as in_f:
                      reader = csv.DictReader(in_f)
                      store_col = 'store_code' if 'store_code' in reader.fieldnames else reader.fieldnames[0]
                      
                      if unmapped_writer is None:
                          unmapped_writer = csv.DictWriter(unmapped_f, fieldnames=reader.fieldnames)
                          mapped_writer = csv.DictWriter(mapped_f, fieldnames=reader.fieldnames)
                          unmapped_writer.writeheader()
                          mapped_writer.writeheader()
                          
                      for row in reader:
                          # 1. Append " GBP" to price and sale_price (applies to both files)
                          for col in price_cols:
                              val = (row.get(col) or '').strip()
                              if val and not val.endswith(' GBP'):
                                  row[col] = f"{val} GBP"
                          
                          # Write the unmapped row first
                          unmapped_writer.writerow(row)
                          
                          # 2. Replace store name in store_code for the mapped file
                          raw_store = (row.get(store_col) or '').strip()
                          if raw_store.lower() in store_map:
                              row[store_col] = store_map[raw_store.lower()]
                              
                          # Write the mapped row
                          mapped_writer.writerow(row)
          EOF
          
          # Clean up temporary files
          rm file1.csv file2.csv

      - name: Commit and push combined CSVs to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/combined-inventory.csv output/combined-inventory-mapped.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update combined inventory CSVs" && git push)
