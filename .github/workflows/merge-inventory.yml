name: Merge Local Inventory CSVs

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and merge CSV files
        env:
          FEED_USER: ${{ secrets.FEED_USER }}
          FEED_PASS: ${{ secrets.FEED_PASS }}
        run: |
          mkdir -p output
          
          # Download using HTTP Basic Authentication (-f fails if credentials are wrong)
          curl -f -sS -u "$FEED_USER:$FEED_PASS" "https://www.bicyclechain.co.uk/csv/202/local-inventory.csv" -o file1.csv
          curl -f -sS -u "$FEED_USER:$FEED_PASS" "https://www.bicyclechain.co.uk/csv/11/local-inventory.csv" -o file2.csv
          
          # Ensure file1 ends with a newline before appending file2
          sed -i -e '$a\' file1.csv
          
          # Copy file1 (including headers) to the output file
          cp file1.csv output/combined-inventory.csv
          
          # Append file2 while skipping its header row (line 1)
          tail -n +2 file2.csv >> output/combined-inventory.csv
          
          # Clean up temporary files
          rm file1.csv file2.csv

      - name: Commit and push combined CSV to repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/combined-inventory.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update combined inventory CSV" && git push)
